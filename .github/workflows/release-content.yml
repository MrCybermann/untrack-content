name: Sign & publish content

# Builds and signs content/index.json when suggestions change on main.
# Requires a repository secret UNTRACK_SIGNING_KEY (base64 Ed25519 private key).
#
# WHAT PUBLISHING MEANS HERE
# Nothing is uploaded anywhere. The signed manifest is committed to main, and
# phones read it straight from this repository through a CDN — which is why this
# repository is public and why the app's is not obliged to be. The app carries
# the matching public key and verifies the signature before reading a byte, so
# the CDN, this repository and the network are all untrusted by design.
#
# THIS JOB HAS BEEN WRONG TWICE. BOTH FAILURES ARE WORTH KNOWING ABOUT.
#
# First it checked out the triggering commit, signed that, then rebased its
# manifest commit onto main before pushing. Two content commits landing close
# together meant replaying a manifest built from the older tree over the newer
# content: new files, old hashes. The app fails closed, so no phone was harmed,
# but publishing silently broke until the next run.
#
# Removing the rebase fixed that and created the opposite fault. A fast-forward
# push fails if anything reaches main mid-run — and an unrelated commit, a
# documentation change say, does not match the path filters below, so no
# replacement run starts. The signed content is simply never published, and the
# only signal is a red tick somebody has to notice.
#
# The answer to both is the same and is what the script below does: never carry
# a manifest across a change to main. If main moved, throw the generated commit
# away and build a new one from what main now contains.

on:
  push:
    branches: [main]
    paths:
      - 'content/apps/**'
      - 'content/device/**'
      # Replacing a guide changes no JSON, so without this the CDN would go on
      # serving the old bytes until its cache expired — and the app would report
      # the new hash mismatching as a corrupt guide.
      - 'media/**'
  # So a run stranded by the race described above can be restarted without
  # inventing a commit.
  workflow_dispatch:

# Only one signing run at a time. Two would race to push the manifest, and while
# the retry below would recover, serialising is cheaper than recovering. Not
# cancel-in-progress: a run that has already pushed must be allowed to purge.
concurrency:
  group: sign-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          # The uuid check compares against the last *published* catalog, which
          # may be several commits back.
          fetch-depth: 0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt

      # -----------------------------------------------------------------------
      #  Sign, and keep signing until what is pushed matches what is on main.
      #
      #  WHY THIS IS ONE STEP AND NOT FIVE
      #  Validation, the uuid check, signing and verification all have to happen
      #  *after* the last fetch of main and *before* the push, or the manifest
      #  describes a tree that is no longer there. Separate steps cannot be
      #  re-run as a group, so the loop has to contain all of them. The echoed
      #  headers below are the readability that structure would have given.
      # -----------------------------------------------------------------------
      - name: Sign and publish
        id: publish
        run: |
          set -euo pipefail

          git config user.name "untrack-bot"
          git config user.email "actions@users.noreply.github.com"

          published=false

          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt"

            # Start from whatever main contains right now. --hard discards any
            # manifest generated by a previous attempt: that manifest described
            # a different tree, and carrying it forward is the original bug.
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            echo "--- Validating content"
            python tools/validate_content.py

            # WHY THE BASE IS THE LAST PUBLISHED CATALOG AND NOT HEAD^
            #
            # HEAD^ compares against the previous commit, which is only the
            # right question when every commit gets its own signing run. It does
            # not. This job signs the head of main, so two content commits
            # landing together are covered by one run — and a uuid removed in
            # the first is absent from both sides of a HEAD^ comparison, which
            # therefore passes.
            #
            # The last commit touching content/index.json is the last state that
            # was actually published to phones. Anything lost since then is a
            # uuid a phone has already recorded progress against, which is
            # exactly the set worth protecting.
            # WHY THE GUARD IS REPEATED HERE
            # validate-content.yml rejects a change that edits index.json, but
            # the two workflows are independent and run at the same time. A red
            # validation job does not stop this one — so on a direct push, a
            # hand-edited manifest can become the "last published" commit this
            # job then trusts as its uuid base, before the guard has finished
            # reporting.
            #
            # Branch protection requiring the validation check would close this
            # more thoroughly, because it would stop the commit landing at all.
            # This is the version that works without depending on a repository
            # setting nobody can see from the code.
            if [ "${{ github.event_name }}" = "push" ] \
               && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git diff --name-only "${{ github.event.before }}..${{ github.sha }}" \
                    | grep -qx 'content/index.json'; then
              echo "::error::This push edits content/index.json, which is generated. Refusing to sign."
              echo "Revert it and let this job regenerate it: git checkout origin/main -- content/index.json"
              exit 1
            fi

            base=$(git log -1 --format=%H -- content/index.json || true)
            if [ -n "$base" ]; then
              echo "--- Checking uuids against the last published catalog ($base)"
              python tools/check_uuid_stability.py --base "$base"
            else
              echo "--- No published catalog yet; nothing to compare uuids against"
            fi

            # WHY THE SECRET IS ON THIS ONE LINE AND NOT ON THE STEP
            #
            # An `env:` block on the step puts the private key in the environment
            # of everything the step runs: the validator and every library it
            # imports, the uuid checker, the verifier, git, and every child
            # process any of them spawn. None of those needs it, and a signing
            # key that half a dozen unrelated programs can read is a blast radius
            # rather than a secret.
            #
            # This form scopes it to the single process that signs. It survives
            # the retry loop because it is evaluated per invocation, which is why
            # the loop was not a reason to widen it in the first place.
            echo "--- Signing"
            UNTRACK_SIGNING_KEY="${{ secrets.UNTRACK_SIGNING_KEY }}" \
              python tools/build_and_sign_manifest.py
            python tools/verify_manifest.py

            git add content/index.json
            if git diff --cached --quiet; then
              echo "No manifest change."
              echo "::endgroup::"
              break
            fi

            git commit --quiet -m "chore: update signed content manifest [skip ci]"

            if git push --quiet origin HEAD:main; then
              echo "Published."
              published=true
              echo "::endgroup::"
              break
            fi

            # Someone else pushed between the fetch and the push. The manifest
            # just built describes the tree from before that push, so it is
            # thrown away at the top of the next attempt rather than rebased.
            echo "main moved during the run. Rebuilding from the new head."
            echo "::endgroup::"
          done

          if [ "$published" = false ] && ! git diff --quiet HEAD origin/main; then
            echo "::error::Could not publish after 3 attempts — main is changing faster than this job can sign. Re-run when it settles."
            exit 1
          fi

          echo "published=$published" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      #  Tell the CDN the files changed
      #
      #  WHY THIS EXISTS
      #  Phones fetch through jsDelivr, which caches a branch reference for
      #  around twelve hours. Without this, a tip merged now reaches nobody
      #  until that expires — and the app cannot tell the difference, because
      #  jsDelivr's stale answer is a valid answer. The fallback to
      #  raw.githubusercontent only fires when jsDelivr *fails*, not when it is
      #  merely out of date.
      #
      #  THE ORDER IS LEAVES FIRST, ROOT LAST, AND IT MATTERS
      #  Media is named by the content files; content files are named, with
      #  their hashes, by the manifest. Purging a parent before its children
      #  leaves a window where a phone reads new references against cached old
      #  bytes — every hash mismatches, the update is discarded, and someone is
      #  shown an error for a release that was fine.
      #
      #  WHY MEDIA IS READ FROM THE CONTENT FILES AND NOT THE MANIFEST
      #  The manifest signs JSON only. Guides are fetched separately and carry
      #  their own hash inside the suggestion that references them, so the
      #  manifest never lists them — an earlier version of this step purged only
      #  what the manifest named and therefore never purged a guide at all.
      #
      #  WHY A FAILURE HERE DOES NOT FAIL THE RELEASE
      #  By this point the catalog is signed, committed and pushed. A purge is an
      #  optimisation on top of an expiry that happens anyway.
      # -----------------------------------------------------------------------
      - name: Purge the CDN
        if: steps.publish.outputs.published == 'true'
        continue-on-error: true
        run: |
          base="https://purge.jsdelivr.net/gh/${{ github.repository }}@main"

          purge() {
            code=$(curl -s -m 30 -o /dev/null -w '%{http_code}' "$base/$1" || echo "000")
            echo "  $code  $1"
          }

          echo "media:"
          jq -r '[ (.suggestions[]?.media?.src // empty), (.icon // empty) ] | .[]' \
            content/apps/*/*.json content/device/*/*.json 2>/dev/null \
            | sort -u \
            | while IFS= read -r src; do
                [ -n "$src" ] && purge "media/$src"
              done

          echo "content:"
          for path in $(jq -r '.files[].path' content/index.json); do
            purge "content/$path"
          done

          echo "manifest:"
          purge "content/index.json"
