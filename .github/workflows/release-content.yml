name: Sign & publish content

# Builds and signs content/index.json when suggestions change on main.
# Requires a repository secret UNTRACK_SIGNING_KEY (base64 Ed25519 private key).
#
# WHAT PUBLISHING MEANS HERE
# Nothing is uploaded anywhere. The signed manifest is committed to main, and
# phones read it straight from this repository through a CDN — which is why this
# repository is public and why the app's is not obliged to be. The app carries
# the matching public key and verifies the signature before reading a byte, so
# the CDN, this repository and the network are all untrusted by design.

on:
  push:
    branches: [main]
    paths:
      - 'content/apps/**'
      - 'content/device/**'
      # Replacing a guide changes no JSON, so without this the CDN would go on
      # serving the old bytes until its cache expired — and the app would report
      # the new hash mismatching as a corrupt guide.
      - 'media/**'

# Only one signing run at a time. Two would race to push the manifest, and the
# loser fails non-fast-forward — which looks like a broken pipeline and is really
# just two jobs doing the same job. Not cancel-in-progress: a signing run that
# has already committed must be allowed to push.
concurrency:
  group: sign-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      # ---------------------------------------------------------------------
      #  WHY THIS CHECKS OUT main RATHER THAN THE TRIGGERING COMMIT
      #  The default checkout is the commit that fired the workflow. That was
      #  fine until you consider two content commits landing close together:
      #  this job signs the tree at its own commit, then had to rebase onto main
      #  before pushing — which replayed a manifest built from the older tree on
      #  top of the newer content. The result is new files with old hashes.
      #
      #  The app fails closed on that, so nobody is harmed, but publishing is
      #  broken until the next run fixes it, and the purge below would have
      #  already pushed the mismatch to the CDN.
      #
      #  Signing the head of main removes the race rather than recovering from
      #  it: whatever this job signs is what main actually contains. With
      #  `concurrency` serialising runs, the second job re-signs the combined
      #  tree and both commits end up correctly covered.
      # ---------------------------------------------------------------------
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          # check_uuid_stability needs a parent to compare against.
          fetch-depth: 0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt

      - name: Validate content
        run: python tools/validate_content.py

      # Runs here as well as in validate-content.yml, and the duplication is the
      # point: those are separate workflows, so validation failing did not stop
      # signing succeeding. A lost uuid silently resets someone's progress, which
      # is not something to publish while a red tick sits on another workflow.
      - name: No published uuid was lost
        run: python tools/check_uuid_stability.py --base HEAD^

      - name: Build & sign manifest
        env:
          UNTRACK_SIGNING_KEY: ${{ secrets.UNTRACK_SIGNING_KEY }}
        run: python tools/build_and_sign_manifest.py

      - name: Verify manifest
        run: python tools/verify_manifest.py

      - name: Commit signed manifest
        id: commit
        run: |
          git config user.name "untrack-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/index.json
          if git diff --cached --quiet; then
            echo "No manifest change."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update signed content manifest [skip ci]"
            # No rebase. This job checked out main, so a fast-forward push is
            # the only correct outcome — and if main moved underneath it, the
            # push failing is the right answer. A rebase here is what replayed
            # an old manifest over new content.
            git push origin HEAD:main
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      #  Tell the CDN the files changed
      #
      #  WHY THIS EXISTS
      #  Phones fetch through jsDelivr, which caches a branch reference for
      #  around twelve hours. Without this, a tip merged now reaches nobody
      #  until that expires — and the app cannot tell the difference, because
      #  jsDelivr's stale answer is a valid answer. The fallback to
      #  raw.githubusercontent only fires when jsDelivr *fails*, not when it is
      #  merely out of date.
      #
      #  THE ORDER IS LEAVES FIRST, ROOT LAST, AND IT MATTERS
      #  Media is named by the content files; content files are named, with
      #  their hashes, by the manifest. Purging a parent before its children
      #  leaves a window where a phone reads new references against cached old
      #  bytes — every hash mismatches, the update is discarded, and someone is
      #  shown an error for a release that was fine.
      #
      #  Going the other way has no bad case: a phone arriving mid-purge reads
      #  the old manifest, concludes it is already current, and tries again
      #  later, by which point everything it needs is warm.
      #
      #  Same rule as the numbered steps in the app's ContentUpdate: never let
      #  the pointer move ahead of the thing it points at.
      #
      #  WHY MEDIA IS READ FROM THE CONTENT FILES AND NOT THE MANIFEST
      #  The manifest signs JSON only. Guides are fetched separately and carry
      #  their own hash inside the suggestion that references them, so the
      #  manifest never lists them — an earlier version of this step purged only
      #  what the manifest named and therefore never purged a guide at all.
      #  Replacing a .webp left jsDelivr serving the old bytes, which the app
      #  correctly reported as a corrupt guide.
      #
      #  WHY A FAILURE HERE DOES NOT FAIL THE RELEASE
      #  By this point the catalog is signed, committed and pushed — the release
      #  succeeded. A purge is an optimisation on top of an expiry that happens
      #  anyway. Failing the workflow would turn a delay nobody would notice into
      #  a red build somebody has to investigate.
      # -----------------------------------------------------------------------
      - name: Purge the CDN
        if: steps.commit.outputs.published == 'true'
        continue-on-error: true
        run: |
          base="https://purge.jsdelivr.net/gh/${{ github.repository }}@main"

          purge() {
            code=$(curl -s -m 30 -o /dev/null -w '%{http_code}' "$base/$1" || echo "000")
            echo "  $code  $1"
          }

          echo "media:"
          # Both places a media path can appear: a suggestion's guide, and an
          # app's icon. `// empty` keeps jq quiet about the ones that have
          # neither. Sorted and deduplicated so a guide shared between two
          # suggestions is purged once.
          jq -r '[ (.suggestions[]?.media?.src // empty), (.icon // empty) ] | .[]' \
            content/apps/*/*.json content/device/*/*.json 2>/dev/null \
            | sort -u \
            | while IFS= read -r src; do
                [ -n "$src" ] && purge "media/$src"
              done

          echo "content:"
          for path in $(jq -r '.files[].path' content/index.json); do
            purge "content/$path"
          done

          echo "manifest:"
          purge "content/index.json"
